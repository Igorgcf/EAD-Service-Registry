server:
  port: ${PORT}

ead:
  serviceRegistry:
    username: ${EUREKA_SERVICE_USERNAME}
    password: ${EUREKA_SERVICE_PASSWORD}

eureka:
  client:
    registerWithEureka: false
    fetchRegistry: false
    service-url:
      defaultZone: ${EUREKA_URL}
    instance:
      hostname: ${APP_DOMAIN_NAME}
      non-secure-port: 80